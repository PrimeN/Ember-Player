name: Read TV profile test failure
on:
  push:
    branches: [enhance/startup-device-and-browser]
permissions:
  actions: read
  contents: read
jobs:
  read-tv-results:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          github-token: ${{ github.token }}
          run-id: 44897315456
          name: Ember-Player-profile-television
          path: tv-results
      - name: Read the failed test from the previous capture
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          for path in Path('tv-results').rglob('TEST-*.xml'):
              for case in ET.parse(path).iter('testcase'):
                  for failure in list(case.findall('failure')) + list(case.findall('error')):
                      print(case.get('name'), failure.attrib)
                      print('\n'.join(failure.itertext())[:7000])
          PY
