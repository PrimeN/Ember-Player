name: Android startup profiles
on:
  pull_request:
  push:
    branches: [beta, main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: player-profiles-${{ github.ref }}
  cancel-in-progress: true
jobs:
  profile:
    name: ${{ matrix.device }} startup profile
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        device: [phone, television]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Enable Android emulator acceleration
        run: sudo chmod a+rw /dev/kvm
      - name: Compile the profiling packages
        run: ./gradlew --no-daemon --max-workers=2 -PincludePerformanceTests=true -PuseMavenCentralMirror=true :app:assembleBenchmark :benchmark:assembleBenchmark
      - name: Collect startup and library scrolling profiles
        env:
          DEVICE: ${{ matrix.device }}
        run: |
          if [ "$DEVICE" = television ]; then
            python3 scripts/collect-startup-profiles.py --television
          else
            python3 scripts/collect-startup-profiles.py
          fi
      - name: Save generated profiles and collection reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Ember-Player-profile-${{ matrix.device }}
          path: |
            benchmark/build/outputs/connected_android_test_additional_output/
            benchmark/build/outputs/androidTest-results/
            benchmark/build/reports/
          retention-days: 7
          if-no-files-found: warn

  merge:
    name: Merge collected startup rules
    needs: profile
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: Ember-Player-profile-*
          path: captures
      - name: Merge phone and TV profiles
        run: python3 scripts/merge-startup-profiles.py captures --output merged
      - name: Save merged profile inputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Ember-Player-startup-rules
          path: merged/*.txt
          if-no-files-found: error
