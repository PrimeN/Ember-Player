name: Android player
on:
  push:
    branches: [beta, main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: player-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Unit tests and optimized release checks
        run: |
          ./gradlew --no-daemon --max-workers=2 -PuseMavenCentralMirror=true testDebugUnitTest bundleRelease lintRelease writeNetworkCryptoClasspath assembleDebugAndroidTest mergeDebugNativeLibs
          ./gradlew --no-daemon --max-workers=2 -PuseMavenCentralMirror=true assembleRelease -PsplitApks=true
      - name: Verify shrunk network authentication algorithms
        run: python3 scripts/verify-network-crypto.py
      - name: Verify native dependency isolation and ARM alignment
        run: python3 scripts/verify-player-native.py app/build/isolated-mpv/libmpv-1.1.0.aar --apk app/build/outputs/apk/release/app-universal-release-unsigned.apk
      - name: Check translation resources
        run: python3 scripts/check-translations.py
      - name: Run Python validation tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Verify and prepare unsigned validation packages
        run: python3 scripts/prepare-release.py
      - name: Save unsigned release build
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Ember-Player-release
          path: dist/
          retention-days: 7
          if-no-files-found: error
      - name: Build an installable debug package on manual runs
        if: github.event_name == 'workflow_dispatch'
        run: ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: Ember-Player-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
