name: Android player
on:
  push:
    branches: [beta, main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: player-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.8.2'
      - name: Unit tests and optimized release checks
        run: gradle --no-daemon --max-workers=2 testDebugUnitTest assembleRelease lintRelease
      - name: Verify native dependency isolation and ARM alignment
        run: python3 scripts/verify-player-native.py app/build/isolated-mpv/libmpv-1.0.0.aar
      - name: Build an installable debug package on manual runs
        if: github.event_name == 'workflow_dispatch'
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: Ember-Player-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
