name: Android player
on:
  push:
    branches: [beta, main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: player-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.8.2'
      - name: Restore release signing key
        if: github.event_name != 'pull_request'
        env:
          EMBER_KEYSTORE_BASE64: ${{ secrets.EMBER_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          encoded = os.environ.get('EMBER_KEYSTORE_BASE64', '').strip()
          if encoded:
              key = Path(os.environ['RUNNER_TEMP']) / 'ember-player-release.p12'
              key.write_bytes(base64.b64decode(''.join(encoded.split()), validate=True))
              key.chmod(0o600)
              with open(os.environ['GITHUB_ENV'], 'a') as env:
                  env.write(f'EMBER_KEYSTORE_FILE={key}\n')
          PY
      - name: Unit tests and optimized release checks
        env:
          EMBER_KEYSTORE_PASSWORD: ${{ secrets.EMBER_KEYSTORE_PASSWORD }}
          EMBER_KEY_ALIAS: ${{ secrets.EMBER_KEY_ALIAS }}
          EMBER_KEY_PASSWORD: ${{ secrets.EMBER_KEY_PASSWORD }}
        run: gradle --no-daemon --max-workers=2 testDebugUnitTest assembleRelease lintRelease
      - name: Verify native dependency isolation and ARM alignment
        run: python3 scripts/verify-player-native.py app/build/isolated-mpv/libmpv-1.0.0.aar
      - name: Check release integrity rules
        run: python3 -m unittest discover -s tests -p 'test_release.py' -v
      - name: Verify and prepare downloadable APK
        if: github.event_name != 'pull_request'
        run: |
          if [ -n "${EMBER_KEYSTORE_FILE:-}" ]; then
            python3 scripts/prepare-release.py --require-signed
          else
            python3 scripts/prepare-release.py
          fi
      - name: Save release build
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: Ember-Player-release
          path: dist/
          retention-days: 7
          if-no-files-found: error
      - name: Build an installable debug package on manual runs
        if: github.event_name == 'workflow_dispatch'
        env:
          EMBER_KEYSTORE_FILE: ''
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: Ember-Player-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
      - name: Remove temporary signing key
        if: always()
        run: |
          if [ -n "${EMBER_KEYSTORE_FILE:-}" ]; then
            rm -f -- "$EMBER_KEYSTORE_FILE"
          fi
